name: CI

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  fmt:
    name: cargo fmt
    runs-on: cvu-test-runner-x64
    container:
      image: rust:1.98.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The pinned rust:1.98.0 image ships a minimal toolchain without the
      # rustfmt/clippy components preinstalled.
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: cvu-test-runner-x64
    container:
      image: rust:1.98.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rustup component add clippy
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: cvu-test-runner-x64
    container:
      image: rust:1.98.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Covers the 70 offline unit tests and the doc tests; the 21
      # live-network certification tests stay #[ignore]d.
      - run: cargo test --all-features

  deny:
    name: cargo deny
    runs-on: cvu-test-runner-x64
    container:
      image: rust:1.98.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: taiki-e/install-action@899b013517f9e7774591216672bf75a46bb9a481 # v2.9.4
        with:
          tool: cargo-deny
      - run: cargo deny check
