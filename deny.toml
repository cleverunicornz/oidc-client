# cargo-deny configuration — enforced by the "Dependency policy" step of the
# single `ci` job in .github/workflows/ci.yml.

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = """\
    Scoped disposition (full record:
    situation/decisions/D-000003-rustsec-2023-0071-rsa-disposition-scoped-ignore.md).
    No patched release exists — patched = [] is intentional; rsa 0.9.10 (stable)
    and 0.10.0-rc.18 are both affected, so no bump escapes the advisory. The
    advisory names private-key-side operations only (timing leak via
    decrypt/sign/unpad). This crate's primary and default rsa path is public-key
    signature verification (src/core/crypto.rs), which is not a named leak path;
    the exposed upstream wrapper CoreRsaPrivateSigningKey
    (src/core/jwk/mod.rs) additionally routes private-key signing through rsa,
    so consumers using that wrapper exercise the advisory's named surface.
    Revisit when a fixed rsa release ships the RustCrypto/RSA #680/#702 work
    (then bump and drop this ignore), or when the advisory is function-scoped
    or names verification-side leak paths.\
    """ },
    { id = "RUSTSEC-2025-0056", reason = """\
    adler is unmaintained — informational, no vulnerable code, no safe upgrade
    (full record: situation/decisions/D-000005-unmaintained-dev-path-advisory-ignores.md).
    Dev-dependency path only: color-backtrace 0.5 -> backtrace 0.3.71 ->
    miniz_oxide 0.7.4 -> adler 1.0.2. The upstream dev-dependencies are kept
    verbatim for import fidelity (situation/decisions/D-000004-...md) and the
    resolver holds backtrace at 0.3.71 under rust-version 1.65. Revisit when
    the dev-dependencies are deliberately modernized.\
    """ },
    { id = "RUSTSEC-2024-0375", reason = """\
    atty is unmaintained by official maintainer notice — informational, no
    vulnerable code, no safe upgrade (full record:
    situation/decisions/D-000005-unmaintained-dev-path-advisory-ignores.md).
    Dev-dependency path only: color-backtrace 0.5.1 and env_logger 0.9.3 ->
    atty 0.2.14, both upstream-pinned verbatim for import fidelity
    (situation/decisions/D-000004-...md). Revisit when the dev-dependencies
    are deliberately modernized.\
    """ },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
